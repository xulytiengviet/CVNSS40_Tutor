name: CVNSS4.0 guide · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-for-dev/site/**'
      - 'scripts/build_cvnss_site.py'
      - 'scripts/build_cvnss_chatgpt_plugin.py'
      - 'cvnss_hub/knowledge*.json'
      - 'cvnss_hub/STANDARDIZATION.md'
      - 'integrations/chatgpt-plugin/**'
      - '.github/workflows/cvnss-pages.yml'
  pull_request:
    paths:
      - 'docs-for-dev/site/**'
      - 'scripts/build_cvnss_site.py'
      - 'scripts/build_cvnss_chatgpt_plugin.py'
      - 'cvnss_hub/knowledge*.json'
      - 'cvnss_hub/STANDARDIZATION.md'
      - 'integrations/chatgpt-plugin/**'
      - '.github/workflows/cvnss-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static guide, plugin download and canonical references
        run: python scripts/build_cvnss_site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
