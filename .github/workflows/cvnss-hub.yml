name: CVNSS4.0 Hub smoke tests

on:
  pull_request:
    paths:
      - 'cvnss_hub/**'
      - 'tests/test_cvnss_hub.py'
      - 'tests/test_cvnss_plugin_package.py'
      - 'tests/test_cvnss_hosted.py'
      - 'deploy/cvnss-mcp/**'
      - 'render.yaml'
      - 'scripts/build_cvnss_chatgpt_plugin.py'
      - 'integrations/chatgpt-plugin/**'
      - 'pyproject.toml'
      - 'deeptutor/modules/manifests/core.json'
      - '.github/workflows/cvnss-hub.yml'
  push:
    branches: [main, feature/cvnss4-knowledge-hub]
    paths:
      - 'cvnss_hub/**'
      - 'tests/test_cvnss_hub.py'
      - 'tests/test_cvnss_plugin_package.py'
      - 'tests/test_cvnss_hosted.py'
      - 'scripts/build_cvnss_chatgpt_plugin.py'
      - 'integrations/chatgpt-plugin/**'
      - 'pyproject.toml'
      - 'deeptutor/modules/manifests/core.json'
      - '.github/workflows/cvnss-hub.yml'

jobs:
  oracle-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimal test dependencies
        run: python -m pip install 'mcp>=1.26.0,<2.0.0' fastapi 'pytest-asyncio>=0.23.0' pytest build setuptools wheel
      - name: Compile source and run focused tests
        run: |
          python -m compileall -q cvnss_hub
          python -m pytest -q --noconftest tests/test_cvnss_hub.py tests/test_cvnss_plugin_package.py tests/test_cvnss_hosted.py
      - name: Build skills-only plugin archive (not a live MCP connection)
        run: |
          python scripts/build_cvnss_chatgpt_plugin.py
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile("dist/cvnss4-knowledge-hub-0.2.0.zip") as archive:
              names = set(archive.namelist())
              assert "cvnss4-knowledge-hub/plugin.json" in names
              assert "cvnss4-knowledge-hub/skills/cvnss4-tutor/SKILL.md" in names
              assert "cvnss4-knowledge-hub/mcp.json" not in names
          PY
      - name: Build core Python wheel
        run: python -m build --wheel --no-isolation
      - name: Verify packaged oracle and source registry
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob('dist/deeptutor-*.whl')
          assert wheels, "Missing deeptutor wheel"
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              expected = {
                  "cvnss_hub/__init__.py",
                  "cvnss_hub/service.py",
                  "cvnss_hub/api.py",
                  "cvnss_hub/mcp_server.py",
                  "cvnss_hub/oracle/bridge.cjs",
                  "cvnss_hub/oracle/cvnss-converter.js",
                  "cvnss_hub/sources.json",
                  "cvnss_hub/knowledge.json",
                  "cvnss_hub/knowledge.schema.json",
                  "cvnss_hub/STANDARDIZATION.md",
              }
              assert expected <= names, sorted(expected - names)
              print("Wheel contains CVNSS4.0 Hub assets")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cvnss4-chatgpt-skill-only
          path: dist/cvnss4-knowledge-hub-0.2.0.zip
          if-no-files-found: error
